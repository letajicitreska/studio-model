<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}[hidden]{display:none!important}</style><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studio 3D model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #DCE6EC;
    --panel: rgba(251,251,249,.92);
    --ink: #22262B;
    --muted: #5F6866;
    --line: #CFD2CD;
    --accent: #A9702A;
    --accent-ink: #FFFFFF;
    --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(28,32,31,.9); --ink: #E7E9E5; --muted: #A2ABA6; --line: #3A413E; --accent: #D9A25C; --accent-ink: #1B1D1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(28,32,31,.9); --ink: #E7E9E5; --muted: #A2ABA6; --line: #3A413E; --accent: #D9A25C; --accent-ink: #1B1D1C;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .ui {
    position: fixed; left: 0; right: 0; z-index: 3; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); display: grid; gap: 8px; }
  .card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .title { display: inline-block; padding: 8px 14px; }
  .title h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .title p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); max-width: 46ch; line-height: 1.35; }
  .row { display: flex; gap: 6px; overflow-x: auto; padding: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .row::-webkit-scrollbar { display: none; }
  .row .lbl { flex: 0 0 auto; align-self: center; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 6px 0 8px; }
  button.chip {
    flex: 0 0 auto; font: 600 14px var(--font-ui); color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 99px; height: 40px; padding: 0 14px; cursor: pointer; white-space: nowrap;
  }
  button.chip:hover { border-color: var(--accent); }
  button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.chip[aria-pressed="true"], button.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .note { font-size: 11.5px; color: var(--muted); padding: 0 4px; pointer-events: none; text-shadow: 0 0 6px var(--bg); }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--ink); }
</style>
<div id="stage"></div>
<div id="fallback">Tenhle prohlížeč nezobrazí 3D scénu (chybí WebGL).</div>
<div class="ui top">
  <div class="card title">
    <h1>Studio – 3D model</h1>
    <p id="hint">Táhni prstem = otáčení, dva prsty = přiblížení.</p>
  </div>
</div>
<div class="ui bottom">
  <div class="note">Rozměry z náčrtu. Barvy a materiály jsou jen orientační, soused je naznačený. Slunce svítí z jihu, sever je na straně oken.</div>
  <div class="card row" id="views" role="group" aria-label="Pohledy"><span class="lbl">Pohled</span></div>
  <div class="card row" id="toggles" role="group" aria-label="Volby"><span class="lbl">Zapnout</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  var V3 = THREE.Vector3;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .88;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  /* ---------- rozměry (m) ---------- */
  var W = 5.5, L = 9.0, T = 0.3, WH = 3.2, ZP = 7.5, PITCH = Math.PI * 35 / 180;       // ZP = začátek přístavby
  var RIDGE = WH + (W / 2) * Math.tan(PITCH), SQ = 1 / Math.cos(PITCH);
  var VR = (W / 2) * SQ;                                    // délka svahu od okapu k hřebeni
  var KB = 3.3;                                             // kumbál 0..3.3, koupelna 3.3..5.5

  var scene = new THREE.Scene();
  var skyDay = new THREE.Color('#CFE2EE'), skyNight = new THREE.Color('#1B2230');
  var skyDayTex = skyTex();
  scene.background = skyDayTex;
  scene.fog = new THREE.Fog('#E3EDEA', 60, 130);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.05, 120);

  /* ---------- textury ---------- */
  function shade(hex, k) {
    var c = new THREE.Color(hex);
    c.r = Math.min(1, c.r * k); c.g = Math.min(1, c.g * k); c.b = Math.min(1, c.b * k);
    return '#' + c.getHexString();
  }
  function woodTex(base, seed, variance, boards, o) {
    o = o || {};
    var S = 1024, n = boards || 8, bh = S / n, s = seed, TAU = Math.PI * 2;
    var rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    var c = document.createElement('canvas'); c.width = c.height = S;
    var b = document.createElement('canvas'); b.width = b.height = S;
    var g = c.getContext('2d'), gb = b.getContext('2d');
    gb.fillStyle = '#9a9a9a'; gb.fillRect(0, 0, S, S);
    var warm = o.warm == null ? 1 : o.warm;
    for (var i = 0; i < n; i++) {
      var y0 = i * bh, k0 = 1 + (rnd() - .5) * variance;
      var grd = g.createLinearGradient(0, y0, 0, y0 + bh);
      grd.addColorStop(0, shade(base, k0 * 1.04)); grd.addColorStop(.5, shade(base, k0 * .97)); grd.addColorStop(1, shade(base, k0 * 1.02));
      g.fillStyle = grd; g.fillRect(0, y0, S, bh);
      /* letokruhy – dlouhé vlnité linky (periodické, aby textura navazovala) */
      var lines = 26 + (rnd() * 14 | 0);
      for (var k = 0; k < lines; k++) {
        var yy = y0 + 2 + rnd() * (bh - 4), amp = (.6 + rnd() * 2.2) * (bh / 64), per = 1 + (rnd() * 3 | 0), ph = rnd() * TAU;
        var dark = rnd() < .72, a = dark ? .03 + rnd() * .08 : .03 + rnd() * .06;
        g.strokeStyle = dark ? 'rgba(' + (74 * warm | 0) + ',42,14,' + a + ')' : 'rgba(255,236,200,' + a + ')';
        g.lineWidth = .5 + rnd() * 1.4;
        g.beginPath();
        for (var x = 0; x <= S; x += 16) {
          var yv = yy + amp * Math.sin(TAU * per * x / S + ph);
          if (x === 0) g.moveTo(x, yv); else g.lineTo(x, yv);
        }
        g.stroke();
        if (dark && rnd() < .5) {
          gb.strokeStyle = 'rgba(40,40,40,' + (a * 2) + ')'; gb.lineWidth = g.lineWidth;
          gb.beginPath();
          for (x = 0; x <= S; x += 16) { yv = yy + amp * Math.sin(TAU * per * x / S + ph); if (x === 0) gb.moveTo(x, yv); else gb.lineTo(x, yv); }
          gb.stroke();
        }
      }
      /* suk */
      if (rnd() < (o.knots == null ? .28 : o.knots)) {
        var kx = 120 + rnd() * (S - 240), ky = y0 + bh * (.3 + rnd() * .4), kr = bh * (.12 + rnd() * .1);
        for (var r = kr; r > 1; r -= 2) {
          g.strokeStyle = 'rgba(60,32,10,' + (.25 + (kr - r) / kr * .3) + ')'; g.lineWidth = 1;
          g.beginPath(); g.ellipse(kx, ky, r * 1.7, r * .8, 0, 0, TAU); g.stroke();
        }
        g.fillStyle = 'rgba(50,26,8,.55)'; g.beginPath(); g.ellipse(kx, ky, kr * .35, kr * .2, 0, 0, TAU); g.fill();
        gb.fillStyle = 'rgba(30,30,30,.7)'; gb.beginPath(); gb.ellipse(kx, ky, kr * 1.1, kr * .55, 0, 0, TAU); gb.fill();
      }
      /* spára mezi prkny + zkosená hrana */
      g.fillStyle = 'rgba(40,22,8,.42)'; g.fillRect(0, y0, S, 2.5);
      g.fillStyle = 'rgba(255,238,205,.22)'; g.fillRect(0, y0 + 2.5, S, 2);
      g.fillStyle = 'rgba(40,22,8,.12)'; g.fillRect(0, y0 + bh - 4, S, 4);
      gb.fillStyle = '#202020'; gb.fillRect(0, y0, S, 3.5);
      gb.fillStyle = '#b8b8b8'; gb.fillRect(0, y0 + 3.5, S, 2.5);
      /* styk prken */
      if (o.joints !== false && rnd() < .7) {
        var jx = rnd() * (S - 6);
        g.fillStyle = 'rgba(40,22,8,.5)'; g.fillRect(jx, y0, 2, bh);
        gb.fillStyle = '#202020'; gb.fillRect(jx, y0, 3, bh);
      }
    }
    var mk = function (cv, srgb) {
      var t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
      if (srgb) t.encoding = THREE.sRGBEncoding;
      return t;
    };
    return { map: mk(c, true), bump: mk(b, false) };
  }
  function woodMat(base, seed, variance, boards, rough, o) {
    var t = woodTex(base, seed, variance, boards, o);
    return std({ map: t.map, bumpMap: t.bump, bumpScale: (o && o.bump) || 1.2, roughness: rough });
  }
  function skyTex() {
    var c = document.createElement('canvas'); c.width = 4; c.height = 256;
    var g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#8FB8DA'); gr.addColorStop(.55, '#C4DDEC'); gr.addColorStop(1, '#EEF3EC');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  function grassTex() {
    var c = document.createElement('canvas'); c.width = 256; c.height = 256;
    var g = c.getContext('2d'); g.fillStyle = '#8DAE72'; g.fillRect(0, 0, 256, 256);
    var s = 7; var rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (var i = 0; i < 2200; i++) {
      g.fillStyle = 'rgba(' + (70 + rnd() * 50 | 0) + ',' + (110 + rnd() * 60 | 0) + ',' + (50 + rnd() * 40 | 0) + ',.35)';
      g.fillRect(rnd() * 256, rnd() * 256, 2, 2);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function std(o) { return new THREE.MeshStandardMaterial(o); }
  var M = {
    wall:   woodMat('#D2AB74', 11, .16, 6, .78, { bump: .7 }),
    floor:  woodMat('#B68450', 23, .16, 6, .5, { bump: .5, knots: .18 }),
    deck:   woodMat('#C9A06A', 31, .2, 10, .85, { bump: 1.6 }),
    raft:   woodMat('#8F6638', 41, .14, 4, .85, { bump: 1.4, knots: .4 }),
    plaster:std({ color: '#E7E1D4', roughness: .95 }),
    white:  std({ color: '#F0ECE2', roughness: .95 }),
    roof:   std({ color: '#2C3136', roughness: .85 }),
    found:  std({ color: '#9C9A94', roughness: 1 }),
    frame:  std({ color: '#2F3438', roughness: .6 }),
    door:   std({ color: '#6D4B2C', roughness: .7 }),
    glass:  std({ color: '#BFDFF0', transparent: true, opacity: .28, roughness: .1, depthWrite: false }),
    mirror: std({ color: '#CFE0E6', roughness: .06, metalness: .35 }),
    curtain:std({ color: '#B9A98E', roughness: 1, side: THREE.DoubleSide }),
    stove:  std({ color: '#40454A', roughness: .6 }),
    chair:  std({ color: '#474D53', roughness: .7 }),
    mat:    std({ color: '#C9D4DA', roughness: 1 }),
    pillow: std({ color: '#F2EEE6', roughness: 1 }),
    fridge: std({ color: '#E8EBEC', roughness: .4 }),
    skin:   std({ color: '#E0B393', roughness: .7 }),
    hair:   std({ color: '#4A3322', roughness: .9 }),
    sweater:std({ color: '#B04A26', roughness: .95 }),
    jeans:  std({ color: '#2E3E56', roughness: .9 }),
    shoe:   std({ color: '#2A2A2C', roughness: .7 }),
    paving: std({ color: '#9B5A47', roughness: 1 }),
    tileR:  std({ color: '#7E4B3D', roughness: .9 }),
    saunaW: woodMat('#6A4A30', 57, .14, 7, .8, { bump: 1.2, knots: .2 }),
    water:  std({ color: '#7DB4C8', roughness: .08, metalness: .1 }),
    spruce: std({ color: '#2F5A3E', roughness: 1 }),
    leaf3:  std({ color: '#93A24C', roughness: 1 }),
    leaf:   std({ color: '#5A8744', roughness: 1 }),
    leaf2:  std({ color: '#6E9650', roughness: 1 }),
    bark:   std({ color: '#6B5239', roughness: 1 }),
    light:  std({ color: '#C79E66', roughness: .8 }),
    neighbor:std({ color: '#CFCAC0', roughness: 1 }),
    ground: std({ map: grassTex(), roughness: 1 }),
    tile:   std({ color: '#CBD2D4', roughness: .6 })
  };

  /* ---------- pomocné funkce ---------- */
  function mapUV(g, roofMode) {
    var p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
    for (var i = 0; i < p.count; i++) {
      var ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i)), u, v;
      if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
      else if (ay >= az) { if (roofMode) { u = p.getX(i); v = p.getZ(i); } else { u = p.getZ(i); v = p.getX(i); } }
      else { u = p.getX(i); v = p.getY(i); }
      uv.setXY(i, u, v);
    }
  }
  /* box v souřadnicích rodiče; mats = jeden materiál nebo pole 6 (+x,-x,+y,-y,+z,-z) */
  function box(parent, x0, x1, y0, y1, z0, z1, mats, roofMode, noShadow) {
    var g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    mapUV(g, roofMode);
    var m = new THREE.Mesh(g, mats);
    m.castShadow = !noShadow; m.receiveShadow = true;
    parent.add(m); return m;
  }
  /* obdélník minus otvory; otvor = [u0,u1,v0,v1] */
  function slice(u0, u1, v0, v1, holes) {
    var us = [u0, u1]; holes.forEach(function (h) { us.push(h[0], h[1]); });
    var U = us.filter(function (v, i) { return us.indexOf(v) === i; }).sort(function (a, b) { return a - b; });
    var out = [];
    for (var i = 0; i < U.length - 1; i++) {
      var a = U[i], b = U[i + 1]; if (b - a < 1e-6) continue;
      var hs = holes.filter(function (h) { return h[0] <= a + 1e-6 && h[1] >= b - 1e-6; }).sort(function (p, q) { return p[2] - q[2]; });
      var cur = v0;
      hs.forEach(function (h) { if (h[2] > cur) out.push([a, b, cur, h[2]]); cur = Math.max(cur, h[3]); });
      if (cur < v1) out.push([a, b, cur, v1]);
    }
    return out;
  }
  function cyl(parent, p, q, r, mat) {
    var d = new V3().subVectors(q, p);
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat);
    m.position.copy(p).addScaledVector(d, .5);
    m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.clone().normalize());
    m.castShadow = true; parent.add(m); return m;
  }
  function glassPlane(parent, w, h, pos, rotY) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.glass);
    m.position.copy(pos); m.rotation.y = rotY || 0; parent.add(m); return m;
  }

  var world = new THREE.Group(); scene.add(world);
  var roofG = new THREE.Group(); world.add(roofG);
  var floorTargets = [];

  var gHouse = new THREE.Group(), gSauna = new THREE.Group(), gGarden = new THREE.Group(), gPergola = new THREE.Group();
  world.add(gHouse, gSauna, gGarden, gPergola);
  var GR = { house: gHouse, sauna: gSauna, garden: gGarden, pergola: gPergola };

  /* ---------- terén, základ, soused ---------- */
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), M.ground);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.2; ground.receiveShadow = true; world.add(ground);
  box(world, -T, W + T, -0.2, -0.005, -T, L + T, M.found);
  var sal = box(world, 0, W, -0.2, 0, 0, ZP, [M.floor, M.floor, M.floor, M.floor, M.floor, M.floor]);
  floorTargets.push(sal);
  box(gHouse, -6.6, -0.8, -0.2, 4.0, -17.8, 4.5, M.neighbor);   // soused: dům s ~4 m zdí od našeho domu zhruba do poloviny studia

  /* ---------- boční stěny ---------- */
  var SILL = .45, WTOP = 2.9;
  var wallR = slice(0, L, 0, WH, [[1.2, 2.7, SILL, WTOP], [3.0, 4.5, SILL, WTOP], [4.95, 5.85, 0, 2.1]]);
  wallR.forEach(function (r) {
    box(world, W, W + T, r[2], r[3], r[0], r[1], [M.plaster, M.wall, M.plaster, M.plaster, M.plaster, M.plaster]);
  });
  box(world, -T, 0, 0, WH, 0, L, [M.plaster, M.plaster, M.plaster, M.plaster, M.plaster, M.plaster]);   // slepá stěna se zrcadly: světlá omítka
  /* za kamny nehořlavý obklad / omítka: kus stěny v rohu u domu */
  box(world, 4.0, W, 0, 2.7, .005, .02, M.plaster, false, true);
  box(world, W - .02, W - .005, 0, 2.7, .02, 1.2, M.plaster, false, true);

  /* velká okna s hlubokým parapetem na sezení (sklo u vnějšího líce zdi) */
  [[1.2, 2.7], [3.0, 4.5]].forEach(function (zz) {
    var z0 = zz[0], z1 = zz[1], zm = (z0 + z1) / 2, x0 = W + T - .13, x1 = W + T - .06, b = .06;
    box(world, x0, x1, SILL, SILL + b, z0, z1, M.frame);
    box(world, x0, x1, WTOP - b, WTOP, z0, z1, M.frame);
    box(world, x0, x1, SILL, WTOP, z0, z0 + b, M.frame);
    box(world, x0, x1, SILL, WTOP, z1 - b, z1, M.frame);
    box(world, x0, x1, SILL, WTOP, zm - .03, zm + .03, M.frame);
    glassPlane(world, z1 - z0 - .1, WTOP - SILL - .1, new V3(W + T - .095, (SILL + WTOP) / 2, zm), Math.PI / 2);
    box(world, W, W + T - .06, SILL - .05, SILL, z0, z1, M.light);                          // dřevěný parapet
    box(world, W, W + T - .14, SILL, SILL + .07, z0 + .03, z1 - .03, M.mat, false, true);   // polštář na sezení
    box(world, W, W + T, SILL, WTOP, z0 - .0, z0 + .001, M.wall, false, true);
  });
  box(world, W + T - .12, W + T - .06, 0, 2.1, 4.95, 5.85, M.door);          // vstupní dveře
  box(world, W + T - .06, W + T - .03, 1.0, 1.04, 5.62, 5.78, M.frame, false, true);

  /* ---------- štíty ---------- */
  function gable(z0, z1, thick, mat, holes) {
    var s = new THREE.Shape();
    var pts = thick ? [[-T, 0], [W + T, 0], [W + T, WH], [W, WH], [W / 2, RIDGE], [0, WH], [-T, WH]]
                    : [[0, 0], [W, 0], [W, WH], [W / 2, RIDGE], [0, WH]];
    s.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]); s.closePath();
    (holes || []).forEach(function (h) {
      var p = new THREE.Path(); p.moveTo(h[0], h[2]); p.lineTo(h[1], h[2]); p.lineTo(h[1], h[3]); p.lineTo(h[0], h[3]); p.closePath(); s.holes.push(p);
    });
